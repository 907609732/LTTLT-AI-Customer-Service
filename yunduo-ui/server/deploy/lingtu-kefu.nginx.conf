log_format lingtu_kefu_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent origin="$http_origin"';

server {
 listen 80;
 server_name account-kefu.lttlt.top api-kefu.lttlt.top;
 access_log /var/log/nginx/lingtu-kefu-access.log lingtu_kefu_safe;
 return 308 https://$host$request_uri;
}

server {
 listen 443 ssl;
 server_name api-kefu.lttlt.top;
 ssl_certificate /var/lib/lingtu-kefu-tls/current/fullchain.pem;
 ssl_certificate_key /var/lib/lingtu-kefu-tls/current/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log /var/log/nginx/lingtu-kefu-access.log lingtu_kefu_safe;
 client_max_body_size 2m;
 gzip on;
 gzip_min_length 1024;
 gzip_types application/json application/javascript text/css image/svg+xml;
 location = /api/setup {
  if ($request_method != GET) { return 403; }
  proxy_pass http://127.0.0.1:3211;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
 location / {
  proxy_pass http://127.0.0.1:3211;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 130s;
  proxy_connect_timeout 5s;
 }
}

server {
 listen 443 ssl;
 server_name account-kefu.lttlt.top;
 ssl_certificate /var/lib/lingtu-kefu-tls/current/fullchain.pem;
 ssl_certificate_key /var/lib/lingtu-kefu-tls/current/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log /var/log/nginx/lingtu-kefu-access.log lingtu_kefu_safe;
 root /opt/lingtu-kefu/current/web;
 index index.html;
 gzip on;
 gzip_min_length 1024;
 gzip_vary on;
 gzip_types application/javascript application/json text/css image/svg+xml;
 location /assets/ {
  try_files $uri =404;
  add_header Cache-Control 'public,max-age=31536000,immutable';
 }
 location / {
  try_files $uri $uri/ /index.html;
  add_header Cache-Control 'no-cache';
 }
}
