<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>MMS 聊天页（desk-v1 离线 fixture）</title>
    <style>
      body { margin: 0; font: 14px/1.5 "Microsoft YaHei", sans-serif; background: #f5f6f8; }
      #app { display: flex; height: 100vh; }
      #sidebar { width: 220px; background: #fff; border-right: 1px solid #e6e8eb; }
      #main { flex: 1; display: flex; flex-direction: column; }
      .chatMessage { flex: 1; overflow: auto; padding: 12px; }
      .msg-item { margin: 6px 0; display: flex; }
      .msg-item.right { justify-content: flex-end; }
      .bubble { max-width: 60%; padding: 8px 12px; border-radius: 6px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
      .right .bubble { background: #c9f0c0; }
      .editor { border-top: 1px solid #e6e8eb; background: #fff; padding: 8px; display: flex; gap: 8px; }
      textarea { flex: 1; height: 64px; resize: none; padding: 8px; border: 1px solid #dcdfe6; border-radius: 4px; }
      button.send-btn { width: 88px; height: 64px; background: #ff6a00; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="nav-sidebar"></div>
      <div id="main">
        <div class="chatMessage" id="panel">
          <div class="msg-item"><div class="bubble">老板这个针织衫还有货吗</div></div>
          <div class="msg-item right"><div class="bubble">亲，有货的哦</div></div>
        </div>
        <div class="editor">
          <textarea id="input" placeholder="请输入回复内容"></textarea>
          <button class="send-btn" id="send">发送</button>
        </div>
      </div>
    </div>
    <script>
      // fixture 记录 hook 实际发送出去的内容
      window.__sent = [];
      const input = document.getElementById('input');
      const panel = document.getElementById('panel');

      function appendMessage(text, mine) {
        const row = document.createElement('div');
        row.className = 'msg-item' + (mine ? ' right' : '');
        const b = document.createElement('div');
        b.className = 'bubble';
        b.textContent = text;
        row.appendChild(b);
        panel.appendChild(row);
        panel.scrollTop = panel.scrollHeight;
        return row;
      }

      function doSend() {
        if (window.__blockSend) return;
        const text = String(input.value || '').trim();
        if (!text) return;
        window.__sent.push(text);
        appendMessage(text, true);
        input.value = '';
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      document.getElementById('send').addEventListener('click', doSend);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          doSend();
        }
      });

      // 测试辅助：追加 DOM 消息
      window.__addBuyerMessage = (text) => appendMessage(String(text), false);
      window.__addSellerMessage = (text) => appendMessage(String(text), true);

      // 离线 WebSocket 替身：hook 注入后包住这个构造器，selftest 可 dispatch 帧
      class MockWebSocket extends EventTarget {
        constructor(url, protocols) {
          super();
          this.url = String(url || '');
          this.protocols = protocols;
          this.readyState = 1;
          MockWebSocket.instances.push(this);
        }
        send() {}
        close() {}
      }
      MockWebSocket.CONNECTING = 0;
      MockWebSocket.OPEN = 1;
      MockWebSocket.CLOSING = 2;
      MockWebSocket.CLOSED = 3;
      MockWebSocket.instances = [];
      window.WebSocket = MockWebSocket;
      window.__pushWsFrame = (frame) => {
        const ws = MockWebSocket.instances[MockWebSocket.instances.length - 1];
        if (!ws) throw new Error('no mock websocket');
        ws.dispatchEvent(new MessageEvent('message', { data: JSON.stringify(frame) }));
        return MockWebSocket.instances.length;
      };
    </script>
  </body>
</html>
