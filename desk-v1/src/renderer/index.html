<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Desk v1</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101318;
        --panel: #171b22;
        --line: #262c36;
        --text: #e8ecf3;
        --muted: #8d97a8;
        --accent: #4f8cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
      }
      .shell { display: flex; height: 100vh; }
      aside {
        width: 300px;
        flex: 0 0 300px;
        border-right: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
      }
      .brand { padding: 18px 20px 12px; font-weight: 600; letter-spacing: 0.4px; }
      .brand small { display: block; color: var(--muted); font-weight: 400; margin-top: 4px; }
      form { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
      input, select, textarea {
        background: #0e1116;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
        outline: none;
      }
      input:focus, select:focus, textarea:focus { border-color: var(--accent); }
      textarea { resize: vertical; min-height: 74px; line-height: 1.5; }
      #store-name { flex: 1 1 120px; min-width: 0; }
      #platform-select { flex: 1 1 100%; }
      form button { flex: 0 0 auto; }
      button {
        background: #222836;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: 0.45; cursor: default; }
      ul { list-style: none; margin: 0; padding: 0 12px; overflow: auto; flex: 1; }
      li {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
        background: #12161d;
      }
      li .name { font-size: 14px; font-weight: 600; }
      li .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .chip { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
      .chip.ok { color: #68d391; background: rgba(104, 211, 145, 0.12); }
      .chip.lost { color: #f6ad55; background: rgba(246, 173, 85, 0.14); }
      .chip.wait { color: #63b3ed; background: rgba(99, 179, 237, 0.14); }
      .chip.idle { color: var(--muted); background: rgba(141, 151, 168, 0.14); }
      li .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
      li .meta.error { color: #fc8181; }
      li .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
      li .actions button { padding: 5px 8px; font-size: 12px; }
      main { flex: 1; display: flex; flex-direction: column; padding: 18px 20px; gap: 14px; min-width: 0; }
      header { display: flex; justify-content: space-between; align-items: center; }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      .hint { color: var(--muted); font-size: 12px; }
      .hint.ok { color: #68d391; }
      .hint.error { color: #fc8181; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
      .panel-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .field.wide { grid-column: 1 / -1; }
      .field span { color: var(--muted); font-size: 11px; }
      .field input, .field textarea, .field select { width: 100%; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .row input { flex: 1 1 240px; max-width: 360px; }
      pre {
        margin: 0;
        font-size: 12px;
        line-height: 1.6;
        color: #b7c2d4;
        white-space: pre-wrap;
        overflow: auto;
        max-height: 260px;
      }
      .empty { color: var(--muted); font-size: 13px; padding: 12px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand">Desk v1<small>多平台店铺同屏客服</small></div>
        <form id="add-form">
          <input id="store-name" placeholder="店铺名称" maxlength="60" required />
          <select id="platform-select" aria-label="平台"></select>
          <button class="primary" type="submit">添加</button>
        </form>
        <ul id="store-list"></ul>
      </aside>
      <main>
        <header>
          <h1>运行状态</h1>
          <span class="hint" id="status-line">加载中…</span>
        </header>
        <section class="panel">
          <div class="panel-title">AI 配置</div>
          <div class="grid">
            <label class="field">
              <span>Base URL（OpenAI 兼容端点，留空则只采集）</span>
              <input id="ai-base-url" placeholder="http://127.0.0.1:11434/v1" maxlength="500" />
            </label>
            <label class="field">
              <span>模型</span>
              <input id="ai-model" placeholder="qwen2.5:7b-instruct" maxlength="120" />
            </label>
            <label class="field">
              <span>Temperature（0 ~ 2）</span>
              <input id="ai-temperature" type="number" min="0" max="2" step="0.1" />
            </label>
            <label class="field">
              <span>超时 ms（1000 ~ 300000）</span>
              <input id="ai-timeout" type="number" min="1000" max="300000" step="1000" />
            </label>
            <label class="field wide">
              <span>System Prompt</span>
              <textarea id="ai-system-prompt" maxlength="8000" placeholder="你是店铺的资深客服……"></textarea>
            </label>
          </div>
          <div class="row" style="margin-top: 10px">
            <button id="save-config" class="primary">保存配置</button>
            <span class="hint" id="config-state"></span>
          </div>
          <div class="row" style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line)">
            <input id="ai-key" type="password" placeholder="AI API Key（仅本机保存）" autocomplete="off" />
            <button id="save-key">保存密钥</button>
            <span class="hint" id="key-state"></span>
          </div>
          <div class="hint" style="margin-top: 6px">密钥只进 secrets.json（safeStorage/DPAPI），不会写入 config.json。</div>
        </section>
        <section class="panel" style="flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0">
          <div class="row" style="justify-content: space-between">
            <strong style="font-size: 13px">最近日志</strong>
            <button id="refresh-logs">刷新</button>
          </div>
          <pre id="logs"></pre>
        </section>
      </main>
    </div>
    <script src="../shared/platform-labels.js"></script>
    <script src="../shared/ui-text.js"></script>
    <script src="app.js"></script>
  </body>
</html>
