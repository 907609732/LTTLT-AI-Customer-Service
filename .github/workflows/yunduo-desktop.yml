name: Build Yunduo Windows desktop
on:
  push:
    branches: [codex/yunduo-managed-desktop-release-20261114]
    paths: ['yunduo-ui/**', '.github/workflows/yunduo-desktop.yml']
  workflow_dispatch:
concurrency:
  group: yunduo-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: yunduo-ui
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: yunduo-ui/package-lock.json
      - name: Install locked toolchain
        run: npm ci
      - name: Verify source, contracts, regressions and build
        run: npm run check
      - name: Verify actual Electron desktop
        run: npm run test:desktop
      - name: Package NSIS installer and ZIP in the cloud
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis zip --x64 --publish never --config.electronDist=node_modules/electron/dist
      - name: Inspect archive and launch the real packaged application
        run: npm run test:packaged
      - name: Record exact source and checksums
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = [ordered]@{
            product = '云朵客服'; version = '1.0.0'; platform = 'windows-x64'
            sourceCommit = $env:SOURCE_SHA; workflow = $env:BUILD_URL
            signed = $false; serverBundled = $false
          }
          $manifest | ConvertTo-Json | Set-Content release/RELEASE-MANIFEST.json -Encoding utf8
          $packages = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.zip' }
          if (($packages | Where-Object Extension -eq '.exe').Count -ne 1 -or ($packages | Where-Object Extension -eq '.zip').Count -ne 1) { throw 'Expected exactly one installer and ZIP' }
          $files = @($packages) + @(Get-Item release/RELEASE-MANIFEST.json)
          $lines = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yunduo-windows-${{ github.sha }}
          path: |
            yunduo-ui/release/*.exe
            yunduo-ui/release/*.zip
            yunduo-ui/release/SHA256SUMS.txt
            yunduo-ui/release/RELEASE-MANIFEST.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish a separate preview download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: yunduo-v1.0.0-preview.20261114.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          Copy-Item docs/RELEASE_20261114.md release/notes.md
          Add-Content release/notes.md "`nSource commit: $env:SOURCE_SHA"
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.zip' -or $_.Name -in 'SHA256SUMS.txt','RELEASE-MANIFEST.json' } | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @files --target $env:SOURCE_SHA --title '云朵客服 Windows 预览包 · 2026-11-14' --notes-file release/notes.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Preview upload failed' }
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yunduo-verification-${{ github.sha }}
          path: |
            yunduo-ui/artifacts/desktop/report.json
            yunduo-ui/artifacts/desktop/managed-account-settings.png
            yunduo-ui/artifacts/packaged/
          if-no-files-found: warn
          retention-days: 30
