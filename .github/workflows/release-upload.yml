name: Upload verified release packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful full verification run ID
        required: true
      tag:
        description: Existing draft release tag (vX.Y.Z)
        required: true
concurrency:
  group: release-upload-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate full verification and matching draft source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          run=$(gh api "repos/$REPO/actions/runs/$RUN_ID")
          test "$(jq -r .conclusion <<< "$run")" = success
          test "$(jq -r .path <<< "$run")" = .github/workflows/verify.yml
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" | jq -e '.jobs | any(.name == "verify" and .conclusion == "success")'
          release=$(gh api "repos/$REPO/releases" --paginate | jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("Draft release must be unique") end')
          test "$(jq -r .draft <<< "$release")" = true
          target=$(jq -r .target_commitish <<< "$release")
          [[ "$target" =~ ^[a-f0-9]{40}$ ]]
          head=$(jq -r .head_sha <<< "$run")
          verified=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)
          target_tree=$(gh api "repos/$REPO/git/commits/$target" --jq .tree.sha)
          test "$verified" = "$target_tree"
      - name: Download exact artifact archives and verify GitHub digests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts")
          for kind in installer frontend; do
            a=$(jq --arg prefix "lingtu-windows-$kind-" '[.artifacts[] | select(.name | startswith($prefix))] | if length == 1 then .[0] else error("Expected exactly one artifact") end' <<< "$artifacts")
            id=$(jq -r .id <<< "$a")
            digest=$(jq -r .digest <<< "$a")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            gh api "repos/$REPO/actions/artifacts/$id/zip" > "$kind.zip"
            echo "${digest#sha256:}  $kind.zip" | sha256sum --check
          done
          mkdir installer
          unzip -q installer.zip -d installer
          sed -i 's/\r$//' installer/SHA256SUMS.txt
          (cd installer && sha256sum --check SHA256SUMS.txt)
          test "$(grep '^version: ' installer/latest.yml | tr -d '\r' | cut -d' ' -f2)" = "${TAG#v}"
          cp frontend.zip "installer/LingtuCustomerService-${TAG#v}-win-x64.zip"
          (cd installer && sha256sum "LingtuCustomerService-${TAG#v}-win-x64.zip" >> SHA256SUMS.txt)
      - name: Upload to draft only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" installer/*.exe installer/*.blockmap installer/latest.yml installer/*.zip installer/SHA256SUMS.txt --repo "$REPO"
