name: Build and verify Electron frontend
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Explicit UI-only requests run their focused acceptance job; release tags/manual runs retain full regression.
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (!contains(github.event.pull_request.title, 'UI-only: UX03') && !contains(github.event.head_commit.message, 'UI-only: UX03'))
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configure Windows desktop for 1440x900 application checks
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - run: npm ci
      - name: Install verified Electron runtime with mirror fallback
        run: |
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) {
            $env:ELECTRON_MIRROR = 'https://npmmirror.com/mirrors/electron/'
            node node_modules/electron/install.js
            if ($LASTEXITCODE -ne 0) { throw 'Electron runtime download failed from both sources' }
          }
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:backend
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:electron
      - run: npm run test:integration
      - run: npx electron-builder --win nsis --publish never --config.electronDist=node_modules/electron/dist
      - run: npm run test:packaged
      - name: Packaged frontend/backend integration
        run: |
          $env:LINGTU_PACKAGED_EXE = (Resolve-Path release/win-unpacked/LingtuCustomerService.exe).Path
          npm run test:integration
      - name: Verify installer update metadata
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "LingtuCustomerService-Setup-$version.exe"
          $installer = Join-Path release $name
          $manifest = Get-Content release/latest.yml -Raw
          if (!(Test-Path $installer) -or !(Test-Path "$installer.blockmap")) { throw 'Missing installer or blockmap' }
          if ($manifest -notmatch ('(?m)^version: ' + [regex]::Escape($version) + '\s*$')) { throw 'Update version mismatch' }
          if ($manifest -notmatch ('(?m)^path: ' + [regex]::Escape($name) + '\s*$')) { throw 'Update installer path mismatch' }
          $expected = [regex]::Match($manifest, '(?m)^sha512: (\S+)').Groups[1].Value
          $actual = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash $installer -Algorithm SHA512).Hash))
          if ($expected -ne $actual) { throw 'Update installer SHA512 mismatch' }
          Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|blockmap|yml)$' } | ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$hash  $($_.Name)" } | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lingtu-windows-installer-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: lingtu-windows-frontend-${{ github.sha }}
          path: release/win-unpacked/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-verification-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  ux03:
    if: >-
      github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') && (contains(github.event.pull_request.title, 'UI-only: UX03') || contains(github.event.head_commit.message, 'UI-only: UX03'))
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - run: npm ci
      - name: Install verified Electron runtime with mirror fallback
        run: |
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) {
            $env:ELECTRON_MIRROR = 'https://npmmirror.com/mirrors/electron/'
            node node_modules/electron/install.js
            if ($LASTEXITCODE -ne 0) { throw 'Electron runtime download failed from both sources' }
          }
      - run: npx playwright install chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/ux03-readability.spec.ts
      - run: npx electron-builder --win --dir --publish never --config.electronDist=node_modules/electron/dist
      - run: node tests/ux03-electron.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lingtu-ux03-windows-${{ github.sha }}
          path: release/win-unpacked/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux03-verification-${{ github.sha }}
          path: test-results/
          retention-days: 14
