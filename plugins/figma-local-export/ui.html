<!doctype html><html lang="zh-CN"><meta charset="utf-8"/><style>
body{font:12px/1.7 Inter,"Microsoft YaHei",sans-serif;color:var(--figma-color-text,#294666);margin:0;padding:22px;background:var(--figma-color-bg,#fff)}h1{font-size:19px;margin:0 0 8px}p{margin:6px 0;color:var(--figma-color-text-secondary,#7890ac)}.tag{display:inline-block;color:#368d72;background:#edf8f3;padding:3px 8px;border-radius:6px;font-size:10px;margin-bottom:12px}.box{border:1px solid var(--figma-color-border,#dbe7f4);border-radius:10px;padding:12px;margin:16px 0;max-height:145px;overflow:auto;white-space:pre-wrap;word-break:break-word}button{background:#348aff;border:0;border-radius:8px;padding:11px;width:100%;color:white;font:inherit;cursor:pointer;margin-top:13px}button:disabled{opacity:.45;cursor:default}label{display:flex;align-items:center;gap:7px;font-size:12px}#status{font-size:11px;margin-top:14px;word-break:break-word}.error{color:#c45e5e!important}.secondary{background:transparent;border:1px solid #bcd7ff;color:#348aff;margin-top:8px}.hint{font-size:10px;margin-top:14px}
</style><body><span class="tag">本地导出 · 禁止网络访问 · 只读</span><h1>灵兔 · 可编辑画板交付</h1><p>导出 Figma 原生图层结构，供 Electron 客户端逐页还原。</p><div class="box" id="selection">请在画布上选中正式 Frame</div><label><input type="checkbox" id="preview" checked/>同时包含 PNG 对照预览</label><button id="export">导出可编辑画板</button><button id="download" class="secondary" hidden>保存 JSON 快照</button><div id="status" role="status"></div><p class="hint">导出包含图层树、组件引用、样式、节点类型和尺寸。不会修改 Figma 文件，不调用 MCP、REST API、云端 AI 或网络。PNG 仅用于视觉对照，客户端必须依据图层结构实现。</p><script>
const selected=document.getElementById('selection'),status=document.getElementById('status'),exportButton=document.getElementById('export'),downloadButton=document.getElementById('download');let downloadUrl=null,filename='lingtu-design-snapshot.json';
exportButton.onclick=()=>{exportButton.disabled=true;downloadButton.hidden=true;status.className='';status.textContent='开始读取图层结构…';parent.postMessage({pluginMessage:{type:'export',includePreview:document.getElementById('preview').checked}},'*');};
downloadButton.onclick=()=>{if(!downloadUrl)return;const a=document.createElement('a');a.href=downloadUrl;a.download=filename;document.body.appendChild(a);a.click();a.remove();};
onmessage=event=>{if(event.source!==parent)return;const m=event.data.pluginMessage;if(!m)return;if(m.type==='selection'){const header=m.fileName+' / '+m.pageName;selected.textContent=header+'\n'+(m.items.length?m.items.map(n=>n.name+' ['+n.type+'] · '+n.width+'×'+n.height+' · '+n.id).join('\n'):'请选中正式 Frame');}else if(m.type==='progress'){status.textContent=m.text;}else if(m.type==='error'){exportButton.disabled=false;status.className='error';status.textContent=m.text;}else if(m.type==='result'){exportButton.disabled=false;const raw=JSON.stringify(m.snapshot,null,2);const blob=new Blob([raw],{type:'application/json'});if(blob.size>20*1024*1024){status.className='error';status.textContent='快照超过 20 MB。请减少选区或关闭 PNG 预览后重试。';return;}if(downloadUrl)URL.revokeObjectURL(downloadUrl);downloadUrl=URL.createObjectURL(blob);filename='lingtu-design-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';downloadButton.hidden=false;const details=m.snapshot.nodes.map(n=>n.name+'（'+Object.keys(n.components||{}).length+' 组件引用 / '+Object.keys(n.styles||{}).length+' 样式引用）').join('；');status.textContent='已导出 '+m.snapshot.nodes.length+' 个可编辑画板。'+details+'。点击保存 JSON。';}};
</script></body></html>
