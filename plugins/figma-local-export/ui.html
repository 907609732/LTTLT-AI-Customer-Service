<!doctype html><html lang="zh-CN"><meta charset="utf-8"/><style>
body{font:12px/1.7 Inter,"Microsoft YaHei",sans-serif;color:var(--figma-color-text,#294666);margin:0;padding:22px;background:var(--figma-color-bg,#fff)}h1{font-size:19px;margin:0 0 8px}p{margin:6px 0;color:var(--figma-color-text-secondary,#7890ac)}.tag{display:inline-block;color:#368d72;background:#edf8f3;padding:3px 8px;border-radius:6px;font-size:10px;margin-bottom:12px}.box{border:1px solid var(--figma-color-border,#dbe7f4);border-radius:10px;padding:12px;margin:16px 0;max-height:110px;overflow:auto;white-space:pre-wrap;word-break:break-word}button{background:#348aff;border:0;border-radius:8px;padding:11px;width:100%;color:white;font:inherit;cursor:pointer;margin-top:13px}button:disabled{opacity:.45;cursor:default}label{display:flex;align-items:center;gap:7px;font-size:12px}#status{font-size:11px;margin-top:14px;word-break:break-word}.error{color:#c45e5e!important}.secondary{background:transparent;border:1px solid #bcd7ff;color:#348aff;margin-top:8px}.hint{font-size:10px;margin-top:14px}
</style><body><span class="tag">本地导出 · 禁止网络访问</span><h1>灵兔 · 本地设计交付</h1><p>把正式画板交给本地 Electron / 代码工具。</p><div class="box" id="selection">请在画布上选中画板</div><label><input type="checkbox" id="preview" checked/>包含 PNG 预览（最长边不超过 1920）</label><button id="export">导出选中画板</button><button id="download" class="secondary" hidden>保存 JSON 快照</button><div id="status" role="status"></div><p class="hint">只读取当前选区，不修改图层，不调用 MCP 或大模型。导出的图片仅为视觉参考；生产图标和图片资源需另行导出。</p><script>
const selected=document.getElementById('selection'),status=document.getElementById('status'),exportButton=document.getElementById('export'),downloadButton=document.getElementById('download');
let downloadUrl=null,filename='lingtu-design-snapshot.json';
exportButton.onclick=()=>{exportButton.disabled=true;downloadButton.hidden=true;status.className='';status.textContent='开始导出…';parent.postMessage({pluginMessage:{type:'export',includePreview:document.getElementById('preview').checked}},'*');};
downloadButton.onclick=()=>{if(!downloadUrl)return;const a=document.createElement('a');a.href=downloadUrl;a.download=filename;document.body.appendChild(a);a.click();a.remove();};
onmessage=event=>{if(event.source!==parent)return;const m=event.data.pluginMessage;if(!m)return;if(m.type==='selection'){selected.textContent=m.items.length?m.items.map(n=>n.name+' · '+n.id).join('\n'):'请在画布上选中正式画板';}else if(m.type==='progress'){status.textContent=m.text;}else if(m.type==='error'){exportButton.disabled=false;status.className='error';status.textContent=m.text;}else if(m.type==='result'){exportButton.disabled=false;const raw=JSON.stringify(m.snapshot,null,2);const blob=new Blob([raw],{type:'application/json'});if(blob.size>20*1024*1024){status.className='error';status.textContent='超过 20 MB，请减少选区或关闭 PNG 预览后重试。';return;}if(downloadUrl)URL.revokeObjectURL(downloadUrl);downloadUrl=URL.createObjectURL(blob);filename='lingtu-design-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';downloadButton.hidden=false;status.textContent='已导出 '+m.snapshot.nodes.length+' 个画板，点击保存 JSON 快照。';}};
</script></body></html>
